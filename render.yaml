services:
  - type: web
    name: earlyclaim
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/earlyclaim.json
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    disk:
      name: earlyclaim-data
      mountPath: /var/data
      sizeGB: 1
